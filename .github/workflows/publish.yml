name: Publish npm package to GitHub Packages

on:
  create:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-npm-publish-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  classify-tag:
    name: Identify stable release tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.classify.outputs.is_stable }}
    steps:
      - name: Classify tag
        id: classify
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to GitHub Packages
    needs: classify-tag
    if: needs.classify-tag.outputs.is_stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.20.2'
      - uses: ./.github/actions/npm-publish-github
        with:
          token: ${{ github.token }}

  release:
    name: Create GitHub release notes
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/npm-create-release
        env:
          GH_TOKEN: ${{ github.token }}
